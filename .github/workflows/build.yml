name: Build

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  workflow_dispatch:

# No Actions artifacts: their storage is shared by the whole account and the package is large.
# On a v* tag the build job itself publishes the release, with both files in one call, once every
# check above has passed.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      # The token that writes releases stays out of .git/config: what pip installs cannot read it.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # The app declares its version in src/emzon/__init__.py; a tag that says otherwise stops the build.
      - name: Version
        shell: bash
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/emzon/__init__.py)
          [ -n "$version" ] || { echo "No __version__ in src/emzon/__init__.py"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Third-party binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download vendor-1 --repo "$GITHUB_REPOSITORY" --dir packaging/downloads
          python packaging/fetch_vendor.py packaging/downloads

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller==6.22.3

      - name: Check FFmpeg encoders
        shell: bash
        run: |
          encoders=$(vendor/ffmpeg.exe -hide_banner -encoders)
          for name in h264_nvenc hevc_nvenc av1_nvenc libx264 libx265 libsvtav1 libmp3lame libvorbis aac; do
            grep -q " $name " <<< "$encoders" || { echo "FFmpeg lacks the $name encoder"; exit 1; }
          done

      - name: Test
        shell: bash
        run: PATH="$PWD/vendor:$PATH" python -m pytest -q

      - name: Build
        run: pyinstaller --noconfirm --distpath dist --workpath build packaging/emzon.spec

      # The packaged app checks its own tools, libmpv and fonts without opening a window.
      - name: Self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/Emzon/Emzon.exe" -ArgumentList "--self-test", "self-test.json" -Wait -PassThru
          Get-Content self-test.json
          if ($process.ExitCode -ne 0) { exit 1 }

      # What an updater does before replacing the files: --quit with nothing open exits at once,
      # and with Emzon open it closes the open copy.
      - name: Quit test
        shell: pwsh
        run: |
          $exe = "dist\Emzon\Emzon.exe"
          $alone = Start-Process -FilePath $exe -ArgumentList "--quit" -PassThru
          if (-not $alone.WaitForExit(15000) -or $alone.ExitCode -ne 0) { Write-Error "--quit with nothing open did not exit cleanly"; exit 1 }
          $app = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($app.HasExited) { Write-Error "Emzon did not stay open (exit code $($app.ExitCode))"; exit 1 }
          $quit = Start-Process -FilePath $exe -ArgumentList "--quit" -PassThru
          if (-not $quit.WaitForExit(15000) -or $quit.ExitCode -ne 0) { Write-Error "--quit did not exit cleanly"; exit 1 }
          if (-not $app.WaitForExit(20000)) { Stop-Process -Id $app.Id -Force; Write-Error "the open copy did not close"; exit 1 }
          Write-Output "the open copy closed with exit code $($app.ExitCode)"

      - name: Package
        shell: pwsh
        run: |
          Set-Content -Path "dist/Emzon/version.txt" -Value $env:APP_VERSION -Encoding utf8NoBOM -NoNewline
          Compress-Archive -Path "dist/Emzon/*" -DestinationPath "dist/Emzon-win-x64.zip"

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" packaging\emzon.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Install for real, check the installed app, uninstall.
      - name: Installer test
        shell: pwsh
        run: |
          $setup = Start-Process -FilePath "dist\Emzon-Setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { Write-Error "setup exited with $($setup.ExitCode)"; exit 1 }
          $app = Join-Path $env:LOCALAPPDATA "Programs\Emzon"
          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Metessi\Emzon.lnk"
          if (-not (Test-Path $shortcut)) { Write-Error "no Start menu shortcut"; exit 1 }
          $check = Start-Process -FilePath (Join-Path $app "Emzon.exe") -ArgumentList "--self-test", "installed.json" -Wait -PassThru
          Get-Content installed.json
          if ($check.ExitCode -ne 0) { exit 1 }
          # Pretend an older version is installed: running the setup again must update it.
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6E1F4A2B-8C3D-4E5F-9A7B-2C1D0E9F8A6B}_is1"
          Set-ItemProperty -Path $key -Name DisplayVersion -Value "0.0.1"
          $update = Start-Process -FilePath "dist\Emzon-Setup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=update.log" -Wait -PassThru
          if ($update.ExitCode -ne 0) { Write-Error "update exited with $($update.ExitCode)"; exit 1 }
          if (-not (Select-String -Path update.log -Pattern "Emzon: updating from 0.0.1 to $env:APP_VERSION" -Quiet)) { Get-Content update.log; Write-Error "the setup did not see the installed version"; exit 1 }
          $now = (Get-ItemProperty -Path $key).DisplayVersion
          if ($now -ne $env:APP_VERSION) { Write-Error "installed version is $now after the update"; exit 1 }
          Write-Output "updated 0.0.1 to $now"
          $remove = Start-Process -FilePath (Join-Path $app "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait -PassThru
          Start-Sleep -Seconds 3
          if ($remove.ExitCode -ne 0 -or (Test-Path (Join-Path $app "Emzon.exe")) -or (Test-Path $shortcut)) { Write-Error "uninstall left files behind"; exit 1 }

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes \
            dist/Emzon-Setup.exe dist/Emzon-win-x64.zip
